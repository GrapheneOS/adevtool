    contexts:
      system_ext_property_contexts:
        - persist.fingerprint.screenprotector.config u:object_r:fingerprint_sp_prop:s0 exact string
  vendor:
    contexts:
      vendor_file_contexts:
        - /(vendor|system/vendor)/bin/etraced u:object_r:etraced_exec:s0
        - /data/vendor/android.hardware.camera.provider@2.7-service-google(/.*)? u:object_r:vendor_camera_data_file:s0
        - /dev/block/by-name/rdbl u:object_r:rdbl_block_device:s0
