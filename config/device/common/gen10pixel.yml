    - bin/hw/android.hardware.power-service.pixel-libperfmgr
    - bin/hw/android.hardware.thermal-service.pixel
    - bin/hw/vendor.google.google_battery-service
    - bin/hw/vendor.google.google_battery.ekf.service
    - bin/pixelstats-vendor
    - etc/init/hw/init.laguna.rc
    - etc/init/pixel-bgtasks-experiment.rc
    - etc/init/pixelstats-vendor.laguna.rc
    - etc/init/vendor.google.google_battery-default.rc
    - etc/powerhint.json
    - etc/pixelstats_config.json
    - etc/thermal_info_config.json
    - etc/thermal_info_config_charge.json
    - etc/thermal_info_config_earlywarnings.json
    - etc/thermal_info_config_lpm.json
    - etc/thermal_info_config_stats.json
    - etc/thermal_info_config_throttling.json
    - etc/thermal_info_config_vt.json
