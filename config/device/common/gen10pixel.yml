kernel_cmdline_exclusions:
  - init_on_alloc=0
  - init_on_free=1

kernel_cmdline_inclusions:
  - aoc_core.aoc_enable_gsa_boot=1
  - vh_sched.load_sequential=1

sepolicy_inclusions:
