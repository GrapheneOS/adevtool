// Enums
// ======================================================================

// Restriction mode attached to `CheckinRequest.checkin_restriction`.
enum CheckinRestriction {
  NO_RESTRICTION = 0;
  SW_DEVICE = 1;
  LATCHSKY_DEVICE = 2;
}

// Guest-user classification for `CheckinRequest.guest_type`.
enum GuestType {
  TYPE_UNKNOWN = 0;
  FULL_GUEST = 1;
}

// High-level device category.
enum DeviceFormFactor {
  FORM_FACTOR_OTHER = 1;
  PHONE = 2;
  TABLET = 3;
  TV = 4;
  GLASS = 5;
  CAR = 6;
  WEARABLE = 7;
  THINGS = 8;
  CHROMEOS_ARC = 9;
  BSTAR = 10;
  DESKTOP = 11;
}

// Logical destination slot for a client ID string.
enum ClientIdSlot {
  BASE_CLIENT_ID = 1;
  SEARCH_CLIENT_ID = 2;
  VOICESEARCH_CLIENT_ID = 3;
  MAPS_CLIENT_ID = 4;
  YOUTUBE_CLIENT_ID = 5;
  MARKET_CLIENT_ID = 6;
  SHOPPER_CLIENT_ID = 7;
  WALLET_CLIENT_ID = 8;
  CHROME_CLIENT_ID = 9;
  PLAYTX_CLIENT_ID = 10;
  PLAYAX_CLIENT_ID = 11;
  PROGRAM_CLIENT_ID = 12;
  PROGRAM2_CLIENT_ID = 13;
  SEARCH_A2_CLIENT_ID = 14;
  RSVD_A2_CLIENT_ID = 15;
  RSVD_A3_CLIENT_ID = 16;
}

// Reason code for `CheckinReason.reason`.
//
// Only values whose meaning could be tied to a specific trigger path in the analyzed build are
// given semantic names. Values ending in `_UNVERIFIED` are known wire values, but their exact
// trigger is not pinned down here.
enum CheckinReasonCode {
  REASON_UNKNOWN = 0;
  STARTUP_OR_MODULE_UPDATE = 1;
  REASON_CODE_2_UNVERIFIED = 2;
  REASON_CODE_3_UNVERIFIED = 3;
  ACCOUNT_CHANGE = 4;
  // Forced when the per-subscription SIM-identity string (serial + IMSI per active
  // subscription, or a "no-sim" sentinel) differs from the value GMS cached on the previous
  // checkin. Also fires after `pm clear` of GMS because the cached value is then missing and
  // the comparison always reports "changed", so this reason on the first checkin after a data
  // clear does not necessarily mean the SIM actually changed.
  SUBSCRIBER_ID_CHANGED = 5;
  SYSTEM_UPGRADE = 6;
  SECRET_CODE = 7;
  SCHEDULED_OR_CHECKIN_BROADCAST = 8;
  CHECKIN_NOW = 9;
  C2DM_CHECKIN_TICKLE = 10;
  REASON_CODE_11_UNVERIFIED = 11;
  REASON_CODE_12_UNVERIFIED = 12;
  REASON_CODE_13_UNVERIFIED = 13;
  REASON_CODE_14_UNVERIFIED = 14;
  DEVICE_OWNER_CHANGED = 15;
  C2DM_CHECKIN_TICKLE_UPLOAD_NONE = 16;
  OTA_UPDATE_UI = 17;
  REASON_CODE_18_UNVERIFIED = 18;
  REASON_CODE_19_UNVERIFIED = 19;
  REASON_CODE_20_UNVERIFIED = 20;
  NETWORK_CALLBACK = 21;
}

// Touchscreen classification matching Android's `Configuration.TOUCHSCREEN_*` constants.
enum TouchscreenType {
  TOUCHSCREEN_UNDEFINED = 0;
  TOUCHSCREEN_NOTOUCH = 1;
  TOUCHSCREEN_STYLUS = 2;
  TOUCHSCREEN_FINGER = 3;
}

// Keyboard classification matching Android's `Configuration.KEYBOARD_*` constants.
enum KeyboardType {
  KEYBOARD_UNDEFINED = 0;
  KEYBOARD_NOKEYS = 1;
  KEYBOARD_QWERTY = 2;
  KEYBOARD_12KEY = 3;
}

// Navigation classification matching Android's `Configuration.NAVIGATION_*` constants.
enum NavigationType {
  NAVIGATION_UNDEFINED = 0;
  NAVIGATION_NONAV = 1;
  NAVIGATION_DPAD = 2;
  NAVIGATION_TRACKBALL = 3;
  NAVIGATION_WHEEL = 4;
}

// Screen size bucket matching the size bits of `Configuration.screenLayout`.
enum ScreenLayout {
  SCREENLAYOUT_UNDEFINED = 0;
  SCREENLAYOUT_SMALL = 1;
  SCREENLAYOUT_NORMAL = 2;
  SCREENLAYOUT_LARGE = 3;
  SCREENLAYOUT_XLARGE = 4;
}

// Default-role labels for one subscription.
enum SubscriptionRole {
  ROLE_VOICE = 0;
  ROLE_DATA = 1;
  ROLE_SMS = 2;
}

// ICC or SIM lock state.
//
// `ICC_LOCK_UNSET` means no active subscription state was available.
enum IccLockState {
  ICC_LOCK_UNSET = 0;
  ICC_LOCK_ENABLED = 1;
  ICC_LOCK_DISABLED = 2;
}

// Ownership or profile-management mode for `GsfVersionInfo.package_name`.
enum AccountMode {
  ACCOUNT_MODE_PERSONAL_DEFAULT = 0;
  ACCOUNT_MODE_PERSONAL_DEVICE_OWNER = 1;
  ACCOUNT_MODE_PERSONAL_PROFILE_OWNER = 2;
  ACCOUNT_MODE_PERSONAL_PROFILE_OWNER_ORG_OWNED = 3;
  ACCOUNT_MODE_NON_PERSONAL_DEVICE_OWNER = 1001;
  ACCOUNT_MODE_NON_PERSONAL_PROFILE_OWNER = 1002;
  ACCOUNT_MODE_NON_PERSONAL_PROFILE_OWNER_ORG_OWNED = 1003;
}
